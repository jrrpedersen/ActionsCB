name: First Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  first_job:
    name: First job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.0

      - name: Say hello
        run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} 👋 from ${{ github.actor }}."
          echo "My secret is 🤫 ${{ secrets.MY_SECRET }}."
          echo "Current branch is '${{ github.ref }}'."

      - name: Show repo files
        run: tree
